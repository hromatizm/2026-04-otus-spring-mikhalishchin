spring:
  datasource:
    url: jdbc:h2:mem:maindb
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        format_sql: true
  sql:
    init:
      mode: always
      data-locations: data.sql
      schema-locations: schema.sql
  shell:
    interactive:
      enabled: true
  h2:
    console:
      path: /h2-console
      settings:
        web-allow-others: true

logging:
  level:
    org.hibernate.SQL: DEBUG
    org.hibernate.orm.jdbc.bind: TRACE